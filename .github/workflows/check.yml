name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check source and content
        run: bun run check

      - name: Build site
        run: bun run build

      - name: Validate built routes
        run: bun run validate:routes
